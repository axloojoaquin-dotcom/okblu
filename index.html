<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blu Robot</title>
  <b:skin><![CDATA[]]></b:skin>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #001220;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Contenedor principal de la cara */
    .face {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      cursor: pointer;
      transition: transform 0.5s ease;
      animation: idleBreathing 4s ease-in-out infinite;
    }

    @keyframes idleBreathing {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    /* Ojos de Blu */
    .eyes-container {
      display: flex;
      gap: 40px;
      align-items: center;
    }
    .eye {
      width: 90px;
      height: 90px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.5), inset 0 0 15px rgba(0, 229, 255, 0.2);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }
    
    .eye::after {
      content: '';
      position: absolute;
      top: 25%;
      left: 25%;
      width: 45px;
      height: 45px;
      background-color: #001220;
      border-radius: 50%;
      transition: all 0.3s ease;
      animation: idleLook 8s ease-in-out infinite;
    }

    @keyframes idleLook {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-4px, 0); }
      75% { transform: translate(4px, 0); }
    }

    /* Boca de Blu */
    .mouth {
      width: 35px;
      height: 18px;
      background-color: #00e5ff;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 0 20px #00e5ff;
      transition: all 0.3s ease;
    }

    /* --- ESTADOS VISUALES --- */

    .face.blink .eye { transform: scaleY(0.08) !important; }
    .face.wink .eye.right { transform: scaleY(0.08) !important; }

    .face.listening { animation: none; }
    .face.listening .eye {
      transform: scale(1.15);
      background-color: #38ef7d;
      box-shadow: 0 0 50px #38ef7d, inset 0 0 15px #ffffff;
    }
    .face.listening .mouth {
      background-color: #38ef7d;
      box-shadow: 0 0 25px #38ef7d;
      width: 45px;
      border-radius: 10px;
    }

    .face.speaking .mouth { animation: talk 0.25s infinite alternate; }

    @keyframes talk {
      0% { height: 10px; width: 30px; }
      100% { height: 30px; width: 45px; border-radius: 50%; }
    }

    .face.happy .eye {
      height: 45px;
      border-radius: 45px 45px 0 0;
      background-color: #ffffff;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
    }
    .face.happy .eye::after { display: none; }
    .face.happy .mouth {
      width: 50px;
      height: 25px;
      border-bottom-left-radius: 25px;
      border-bottom-right-radius: 25px;
    }

    .face.confused .eye.left { transform: scale(1.25); }
    .face.confused .eye.right { transform: scale(0.75); }
    .face.confused .mouth {
      width: 40px;
      height: 8px;
      border-radius: 4px;
      transform: rotate(-12deg);
    }

    .face.sleeping { animation: sleepPulse 6s ease-in-out infinite; }
    @keyframes sleepPulse {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50% { opacity: 0.8; transform: translateY(3px); }
    }
    .face.sleeping .eye {
      height: 10px;
      width: 80px;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }
    .face.sleeping .eye::after { display: none; }
    .face.sleeping .mouth {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      opacity: 0.6;
    }

    .face.waking .eye { animation: wakeUpEye 0.8s ease forwards; }
    @keyframes wakeUpEye {
      0% { height: 10px; width: 80px; }
      50% { height: 100px; width: 90px; }
      100% { height: 90px; width: 90px; }
    }

    /* Texto de Estado */
    #status {
      position: absolute;
      bottom: 30px;
      color: #00e5ff;
      font-size: 12px;
      opacity: 0.8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: opacity 0.3s;
      text-align: center;
      max-width: 80%;
      line-height: 1.4;
    }

    /* Botón de Micrófono */
    #micBtn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(56, 239, 125, 0.15);
      border: 1px solid rgba(56, 239, 125, 0.5);
      color: #38ef7d;
      border-radius: 12px;
      padding: 0 16px;
      height: 44px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
    }
    #micBtn.off {
      background: rgba(255, 75, 75, 0.15);
      border-color: rgba(255, 75, 75, 0.5);
      color: #ff4b4b;
    }

    /* Botón de Pantalla Completa */
    #fullscreenBtn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.25);
      color: #00e5ff;
      border-radius: 12px;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
    }
    #fullscreenBtn:active { transform: scale(0.9); background: rgba(0, 229, 255, 0.3); }
    #fullscreenBtn svg { width: 20px; height: 20px; fill: #00e5ff; }
  </style>
</head>
<body>
  <b:section id='main' showwithcss='no'/>

  <div class="face" id="bluFace">
    <div class="eyes-container">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>
    <div class="mouth"></div>
  </div>

  <div id="status">TOCA "MIC ON" O LA PANTALLA PARA ACTIVAR</div>

  <button id="micBtn">MIC ON</button>
  <button id="fullscreenBtn" title="Pantalla Completa">
    <svg viewBox="0 0 24 24">
      <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
    </svg>
  </button>

  <script>//<![CDATA[
    // --- PEGA TU API KEY DE GEMINI AQUÍ (MANTENIENDO LAS COMILLAS) ---
    const API_KEY = "AQ.Ab8RN6ILJmVTwtsNGDi0kltMF3hjnKL7wfj4-yYxhVomXXULPg"; 
    const SYSTEM_PROMPT = "Eres Blu, un robot de escritorio azul, muy tierno, simpático y curioso. Responde siempre en una sola frase corta (máximo 15 palabras) para que suene fluido al hablar.";

    const bluFace = document.getElementById('bluFace');
    const statusText = document.getElementById('status');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const micBtn = document.getElementById('micBtn');

    let wakeLock = null;
    let isSleeping = false;
    let isMicEnabled = true;
    let inactivityTimer = null;
    const INACTIVITY_TIME = 45000;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        resetInactivityTimer();
        setFaceState('listening');
        statusText.textContent = 'Blu está escuchando...';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        statusText.textContent = `Dijiste: "${transcript}"`;
        processCommand(transcript);
      };

      recognition.onerror = (e) => {
        if (e.error !== 'no-speech') {
          console.log("Error de micrófono:", e.error);
        }
      };

      recognition.onend = () => {
        if (isMicEnabled && !bluFace.classList.contains('speaking') && !isSleeping) {
          setFaceState('idle');
          setTimeout(() => {
            startListening();
          }, 300);
        } else if (!isMicEnabled) {
          setFaceState('idle');
          statusText.textContent = 'Micrófono Apagado (MIC OFF)';
        }
      };
    } else {
      statusText.textContent = 'Tu navegador no soporta reconocimiento de voz.';
    }

    function startListening() {
      if (recognition && isMicEnabled && !bluFace.classList.contains('speaking') && !isSleeping) {
        try {
          recognition.start();
        } catch(e) {}
      }
    }

    function stopListening() {
      if (recognition) {
        try {
          recognition.stop();
        } catch(e) {}
      }
    }

    function toggleMic() {
      isMicEnabled = !isMicEnabled;
      if (isMicEnabled) {
        micBtn.textContent = 'MIC ON';
        micBtn.classList.remove('off');
        statusText.textContent = 'Micrófono encendido';
        startListening();
      } else {
        micBtn.textContent = 'MIC OFF';
        micBtn.classList.add('off');
        statusText.textContent = 'Micrófono apagado';
        stopListening();
      }
    }

    micBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMic();
    });

    function setFaceState(state) {
      bluFace.className = 'face';
      if (state !== 'idle') {
        bluFace.classList.add(state);
      }
      isSleeping = (state === 'sleeping');
      if (isSleeping) {
        statusText.style.opacity = '0.3';
        statusText.textContent = 'Blu está durmiendo (zZz)';
        stopListening();
      } else {
        statusText.style.opacity = '0.8';
      }
    }

    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      if (isSleeping) {
        wakeUp();
      }
      inactivityTimer = setTimeout(() => {
        setFaceState('sleeping');
      }, INACTIVITY_TIME);
    }

    function wakeUp() {
      setFaceState('waking');
      statusText.textContent = 'Blu está despertando...';
      setTimeout(() => {
        setFaceState('idle');
        statusText.textContent = 'Blu está en reposo';
        if (isMicEnabled) {
          startListening();
        }
      }, 800);
    }

    setInterval(() => {
      if (bluFace.className === 'face') {
        bluFace.classList.add('blink');
        setTimeout(() => bluFace.classList.remove('blink'), 150);
      }
    }, 4000);

    setInterval(() => {
      const now = new Date();
      if (now.getMinutes() === 0 && now.getSeconds() < 5 && bluFace.className === 'face') {
        bluFace.classList.add('wink');
        setTimeout(() => bluFace.classList.remove('wink'), 400);
      }
    }, 5000);

    // PROCESAMIENTO DE COMANDOS CON FALLBACK AUTOMÁTICO DE MODELOS
    async function processCommand(text) {
      stopListening();
      const lower = text.toLowerCase();

      if (lower.includes("duérmete") || lower.includes("duermete") || lower.includes("a dormir")) {
        speak("Buenas noches... Me voy a descansar.", () => setFaceState('sleeping'));
        return;
      }
      if (lower.includes("gracias") || lower.includes("te quiero") || lower.includes("lindo")) {
        setFaceState('happy');
      }

      if (API_KEY === "TU_API_KEY_DE_GEMINI_AQUI" || !API_KEY) {
        statusText.textContent = "FALTA CONFIGURAR LA API KEY EN EL CÓDIGO";
        speak("Falta colocar mi clave de API de Gemini en el código.");
        return;
      }

      statusText.textContent = "Blu está pensando...";
      
      // Lista de modelos a probar en orden automático
      const modelsToTry = [
        "gemini-2.0-flash",
        "gemini-1.5-flash",
        "gemini-1.5-flash-latest",
        "gemini-2.5-flash"
      ];

      let lastError = "";
      let success = false;

      for (const model of modelsToTry) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`;
          
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `${SYSTEM_PROMPT}\n\nEl usuario dice: "${text}"` }] }]
            })
          });

          const data = await response.json();

          if (response.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
            const reply = data.candidates[0].content.parts[0].text.trim();
            speak(reply);
            success = true;
            break; // Si un modelo responde bien, termina la búsqueda
          } else if (data.error) {
            lastError = data.error.message;
          }
        } catch (err) {
          lastError = err.message;
        }
      }

      if (!success) {
        console.error("Ningún modelo respondió:", lastError);
        statusText.textContent = `ERROR: ${lastError}`;
        setFaceState('confused');
        speak("No logré conectar con mi clave de acceso.");
      }
    }

    function speak(text, callback) {
      stopListening();

      if (!bluFace.classList.contains('happy') && !bluFace.classList.contains('confused')) {
        setFaceState('speaking');
      } else {
        bluFace.classList.add('speaking');
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.pitch = 1.3;
      utterance.rate = 1.0;

      utterance.onend = () => {
        bluFace.classList.remove('speaking');
        if (callback) {
          callback();
        } else {
          setTimeout(() => {
            setFaceState('idle');
            statusText.textContent = 'Blu está en reposo';
            if (isMicEnabled && !isSleeping) {
              startListening();
            }
          }, 800);
        }
        resetInactivityTimer();
      };

      window.speechSynthesis.speak(utterance);
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock no permitido:', err.message);
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    fullscreenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          requestWakeLock();
        }).catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    document.body.addEventListener('click', () => {
      resetInactivityTimer();
      if (isSleeping) {
        wakeUp();
        return;
      }
      if (isMicEnabled) {
        requestWakeLock();
        startListening();
      }
    });

    resetInactivityTimer();
  //]]></script>
</body>
</html>
