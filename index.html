<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blu Robot - Asistente IA Completo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #001220;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Contenedor principal centrado */
    .face {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      cursor: pointer;
      transition: transform 0.5s ease;
      animation: idleBreathing 4s ease-in-out infinite;
    }

    @keyframes idleBreathing {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    /* Ojos de Blu */
    .eyes-container {
      display: flex;
      gap: 40px;
      align-items: center;
    }
    .eye {
      width: 90px;
      height: 90px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.5), inset 0 0 15px rgba(0, 229, 255, 0.2);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }
    
    /* Pupilas */
    .eye::after {
      content: '';
      position: absolute;
      top: 25%;
      left: 25%;
      width: 45px;
      height: 45px;
      background-color: #001220;
      border-radius: 50%;
      transition: all 0.3s ease;
      animation: idleLook 8s ease-in-out infinite;
    }

    @keyframes idleLook {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-4px, 0); }
      75% { transform: translate(4px, 0); }
    }

    /* Boca de Blu */
    .mouth {
      width: 35px;
      height: 18px;
      background-color: #00e5ff;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 0 20px #00e5ff;
      transition: all 0.3s ease;
    }

    /* --- ESTADOS EMOCIONALES Y DE ACCIÓN --- */

    /* Parpadeo */
    .face.blink .eye {
      transform: scaleY(0.08) !important;
    }

    /* Guiño de hora */
    .face.wink .eye.right {
      transform: scaleY(0.08) !important;
    }

    /* Escuchando */
    .face.listening {
      animation: none;
    }
    .face.listening .eye {
      transform: scale(1.15);
      background-color: #38ef7d;
      box-shadow: 0 0 50px #38ef7d, inset 0 0 15px #ffffff;
    }
    .face.listening .mouth {
      background-color: #38ef7d;
      box-shadow: 0 0 25px #38ef7d;
      width: 45px;
      border-radius: 10px;
    }

    /* Hablando */
    .face.speaking .mouth {
      animation: talk 0.25s infinite alternate;
    }

    @keyframes talk {
      0% { height: 10px; width: 30px; }
      100% { height: 30px; width: 45px; border-radius: 50%; }
    }

    /* Estado: FELIZ (^ ^) */
    .face.happy .eye {
      height: 45px;
      border-radius: 45px 45px 0 0;
      background-color: #ffffff;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
    }
    .face.happy .eye::after {
      display: none;
    }
    .face.happy .mouth {
      width: 50px;
      height: 25px;
      border-bottom-left-radius: 25px;
      border-bottom-right-radius: 25px;
    }

    /* Estado: CONFUNDIDO (?_?) */
    .face.confused .eye.left {
      transform: scale(1.25);
    }
    .face.confused .eye.right {
      transform: scale(0.75);
    }
    .face.confused .mouth {
      width: 40px;
      height: 8px;
      border-radius: 4px;
      transform: rotate(-12deg);
    }

    /* Estado: DORMIDO (zZz) */
    .face.sleeping {
      animation: sleepPulse 6s ease-in-out infinite;
    }
    @keyframes sleepPulse {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50% { opacity: 0.8; transform: translateY(3px); }
    }
    .face.sleeping .eye {
      height: 10px;
      width: 80px;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }
    .face.sleeping .eye::after {
      display: none;
    }
    .face.sleeping .mouth {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      opacity: 0.6;
    }

    /* Estado: DESPERTANDO */
    .face.waking .eye {
      animation: wakeUpEye 0.8s ease forwards;
    }
    @keyframes wakeUpEye {
      0% { height: 10px; width: 80px; }
      50% { height: 100px; width: 90px; }
      100% { height: 90px; width: 90px; }
    }

    /* Texto de Estado inferior */
    #status {
      position: absolute;
      bottom: 30px;
      color: #00e5ff;
      font-size: 13px;
      opacity: 0.6;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: opacity 0.3s;
    }

    /* Botón de Pantalla Completa */
    #fullscreenBtn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.25);
      color: #00e5ff;
      border-radius: 12px;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
    }
    #fullscreenBtn:active {
      transform: scale(0.9);
      background: rgba(0, 229, 255, 0.3);
    }
    #fullscreenBtn svg {
      width: 20px;
      height: 20px;
      fill: #00e5ff;
    }
  </style>
</head>
<body>

  <div class="face" id="bluFace">
    <div class="eyes-container">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>
    <div class="mouth"></div>
  </div>

  <div id="status">Toca la pantalla para activar a Blu</div>

  <button id="fullscreenBtn" title="Pantalla Completa">
    <svg viewBox="0 0 24 24">
      <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
    </svg>
  </button>

  <script>
    // --- CONFIGURACIÓN DE IA ---
    // Coloca tu clave de API (OpenAI o Gemini) aquí
    const API_KEY = "TU_API_KEY_AQUI"; 
    const SYSTEM_PROMPT = "Eres Blu, un robot de escritorio azul, muy tierno, simpático y curioso. Responde siempre en una sola frase corta (máximo 15 palabras) para que suene fluido al hablar.";

    const bluFace = document.getElementById('bluFace');
    const statusText = document.getElementById('status');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    let wakeLock = null;
    let isSleeping = false;
    let inactivityTimer = null;
    const INACTIVITY_TIME = 45000; // 45 segundos para ir a dormir

    // Reconocimiento de Voz
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        resetInactivityTimer();
        setFaceState('listening');
        statusText.textContent = 'Blu está escuchando...';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        statusText.textContent = `Dijiste: "${transcript}"`;
        processCommand(transcript);
      };

      recognition.onerror = () => {
        setFaceState('confused');
        statusText.textContent = 'No entendí lo que dijiste...';
        speak("Mmm, no logré entenderte bien.");
      };

      recognition.onend = () => {
        if (!bluFace.classList.contains('speaking') && !bluFace.classList.contains('confused')) {
          setFaceState('idle');
        }
      };
    } else {
      statusText.textContent = 'Tu navegador no soporta reconocimiento de voz.';
    }

    // Control de Estados de la Cara
    function setFaceState(state) {
      bluFace.className = 'face';
      if (state !== 'idle') {
        bluFace.classList.add(state);
      }
      isSleeping = (state === 'sleeping');
      if (isSleeping) {
        statusText.style.opacity = '0.2';
        statusText.textContent = 'Blu está durmiendo (zZz)';
      } else {
        statusText.style.opacity = '0.6';
      }
    }

    // Temporizador de Inactividad (Sueño)
    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      if (isSleeping) {
        wakeUp();
      }
      inactivityTimer = setTimeout(() => {
        setFaceState('sleeping');
      }, INACTIVITY_TIME);
    }

    function wakeUp() {
      setFaceState('waking');
      statusText.textContent = 'Blu está despertando...';
      setTimeout(() => {
        setFaceState('idle');
        statusText.textContent = 'Blu está en reposo';
      }, 800);
    }

    // Parpadeo Aleatorio
    setInterval(() => {
      if (bluFace.className === 'face') {
        bluFace.classList.add('blink');
        setTimeout(() => bluFace.classList.remove('blink'), 150);
      }
    }, 4000);

    // Guiño de hora en punto
    setInterval(() => {
      const now = new Date();
      if (now.getMinutes() === 0 && now.getSeconds() < 5 && bluFace.className === 'face') {
        bluFace.classList.add('wink');
        setTimeout(() => bluFace.classList.remove('wink'), 400);
      }
    }, 5000);

    // PROCESAMIENTO DE COMANDOS (IA + Filtros Locales)
    async function processCommand(text) {
      const lower = text.toLowerCase();

      // 1. Filtros locales rápidos (expresiones instantáneas)
      if (lower.includes("duérmete") || lower.includes("duermete") || lower.includes("a dormir")) {
        speak("Buenas noches... Me voy a descansar.", () => setFaceState('sleeping'));
        return;
      }
      if (lower.includes("gracias") || lower.includes("te quiero") || lower.includes("lindo")) {
        setFaceState('happy');
      }

      // 2. Si no hay API KEY configurada, responde con demo
      if (API_KEY === "TU_API_KEY_AQUI") {
        let demoReply = "Escuché lo que dijiste, pero necesitas configurar tu API Key para que pueda responder cualquier cosa.";
        if (lower.includes("hola") || lower.includes("blu")) demoReply = "¡Hola! Soy Blu. Configura mi API Key para conversar conmigo.";
        speak(demoReply);
        return;
      }

      // 3. Conexión con IA (Gemini REST API / OpenAI API)
      statusText.textContent = "Blu está pensando...";
      
      try {
        // Ejemplo utilizando la API de OpenAI (gpt-4o-mini)
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              { role: "user", content: text }
            ],
            max_tokens: 60
          })
        });

        const data = await response.json();
        const reply = data.choices[0].message.content.trim();
        speak(reply);

      } catch (error) {
        console.error("Error al conectar con la IA:", error);
        setFaceState('confused');
        speak("Ups, me costó trabajo conectar con mi cerebro en la nube.");
      }
    }

    // Síntesis de Voz
    function speak(text, callback) {
      if (!bluFace.classList.contains('happy') && !bluFace.classList.contains('confused')) {
        setFaceState('speaking');
      } else {
        bluFace.classList.add('speaking');
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.pitch = 1.3; // Tono agudo y tierno
      utterance.rate = 1.0;

      utterance.onend = () => {
        bluFace.classList.remove('speaking');
        if (callback) {
          callback();
        } else {
          setTimeout(() => {
            setFaceState('idle');
            statusText.textContent = 'Blu está en reposo';
          }, 1000);
        }
        resetInactivityTimer();
      };

      window.speechSynthesis.speak(utterance);
    }

    // Control de Bloqueo de Pantalla (Wake Lock API)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock no permitido:', err.message);
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // Control de Pantalla Completa
    fullscreenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          requestWakeLock();
        }).catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // Evento de toque para activar a Blu
    document.body.addEventListener('click', () => {
      resetInactivityTimer();
      if (isSleeping) {
        wakeUp();
        return;
      }
      if (recognition && !bluFace.classList.contains('speaking')) {
        requestWakeLock();
        try {
          recognition.start();
        } catch(e) {
          // Ya escuchando
        }
      }
    });

    // Inicializar
    resetInactivityTimer();
  </script>
</body>
</html>
